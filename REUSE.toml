# REUSE 规范的路径 → 许可 映射（https://reuse.software/）。
#
# 为什么需要这个文件：本仓库是**聚合**（aggregation）——自己的代码、第三方字体、
# THBWiki 派生的面次参照表、授权凭据各持各的许可，**没有**单一 SPDX 表达式能描述
# 整个仓库。所以逐路径声明，再跑 `reuse lint` 校验有没有漏网的"许可未定"文件。
#
# 校验：uvx --from reuse reuse lint
#
# 优先级口径：**全部用默认的 `closest`**（路径最贴近文件的那条生效），不写 `precedence`。
# 这是有意的：若给 `data/**` 与 `data/meta/stage-cast.tsv` 都标 `override`，两条互相
# 冲突、结果不确定；靠"精确路径比 `**` 更近"来分胜负则是确定性的。
# 别在这里加 `precedence`，除非你确定要叠加（aggregate）或强行覆盖（override）。

version = 1

SPDX-PackageName = "touhou-music-cards"
SPDX-PackageSupplier = "multimode_Liu <https://github.com/Dustymind>"
SPDX-PackageDownloadLocation = "https://github.com/Dustymind/touhou-music-cards-reconstructed"

# ---- 兜底：本仓库自己的代码与文档 ---------------------------------------------------
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 multimode_Liu"
SPDX-License-Identifier = "MIT"

# ---- 字体：Inconsolata 原样分发，保持 OFL-1.1 --------------------------------------
# 不可按 MIT 再许可（版权不归本项目）。因为分发的是**未修改**的 TTF，
# OFL 的 Reserved Font Name 条款不触发 —— 不要改文件名，也不要改字体内部名称表。
[[annotations]]
path = "src/assets/**"
SPDX-FileCopyrightText = "2006 The Inconsolata Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# ---- 数据：本仓库自己的汇编 --------------------------------------------------------
# 曲名/角色名/碟名是事实；分类规则见 docs/rules-classification-v1.md，
# 来源见 docs/data-provenance.md。**不复制 THBWiki 的任何正文**。
[[annotations]]
path = ["data/**"]
SPDX-FileCopyrightText = "2026 multimode_Liu"
SPDX-License-Identifier = "MIT"

# ---- 面次参照表：唯一一处**按 THBWiki 的许可**分发的文件（方案 B）------------------
# `data/meta/stage-cast.tsv` 的曲名与角色名是 THBWiki 的**中文翻译**（翻译是演绎行为），
# 所以它**不能**跟着 `data/**` 一起按 MIT 发。保留提交、单独标成 THBWiki 的许可。
# 它只是 `tmc.validate` 导出的离线复核表，**没有任何代码读它**，也不进前端产物。
# 背景与实测见 docs/data-provenance.md §5 与 docs/DECISIONS.md 的 D170。
[[annotations]]
path = "data/meta/stage-cast.tsv"
SPDX-FileCopyrightText = "THBWiki contributors"
SPDX-License-Identifier = "CC-BY-NC-SA-3.0"

# ---- 授权凭据：截图里有他人（上游作者）的文字，不能按 MIT 再许可 --------------------
# 这是"留档"性质的证据文件，不是本项目的作品，所以用一个自定义的 LicenseRef 标明，
# 而不是让上面 `**` 的 MIT 兜底把它吃掉。说明见 LICENSES/LicenseRef-Permission-Evidence.txt。
[[annotations]]
path = "docs/permissions/**"
SPDX-FileCopyrightText = "2025 电球 魔爱天下第一，multimode_Liu"
SPDX-License-Identifier = "LicenseRef-Permission-Evidence"

# ---- 数据子模块：独立仓库，许可应在各自仓库里声明 ----------------------------------
# 这里只是让 lint 有个交代；真正的 LICENSE 要加到那两个仓库里（见 THIRD-PARTY-NOTICES.md 第 6.3 节）。
[[annotations]]
path = ["data/otomads/**", "data/custom/**"]
SPDX-FileCopyrightText = "2026 multimode_Liu"
SPDX-License-Identifier = "MIT"
