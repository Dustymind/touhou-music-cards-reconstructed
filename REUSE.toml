# REUSE 规范的路径 → 许可 映射（https://reuse.software/）。
#
# 为什么需要这个文件：本仓库是**聚合**（aggregation）——自己的代码、第三方字体、
# THBWiki 派生的面次参照表、授权凭据各持各的许可，**没有**单一 SPDX 表达式能描述
# 整个仓库。所以逐路径声明，再跑 `reuse lint` 校验有没有漏网的"许可未定"文件。
#
# 校验：uvx --from reuse reuse lint
#
# 优先级口径：**全部用默认的 `closest`**（路径最贴近文件的那条生效），不写 `precedence`。
# 别在这里加 `precedence`，除非你确定要叠加（aggregate）或强行覆盖（override）。

version = 1

SPDX-PackageName = "touhou-music-cards"
SPDX-PackageSupplier = "multimode_Liu <https://github.com/Dustymind>"
SPDX-PackageDownloadLocation = "https://github.com/Dustymind/touhou-music-cards-reconstructed"

# ---- 兜底：本仓库自己的代码与文档 ---------------------------------------------------
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 multimode_Liu"
SPDX-License-Identifier = "MIT"

# ---- 字体：Inconsolata 原样分发，保持 OFL-1.1 --------------------------------------
# 不可按 MIT 再许可（版权不归本项目）。因为分发的是**未修改**的 TTF，
# OFL 的 Reserved Font Name 条款不触发 —— 不要改文件名，也不要改字体内部名称表。
[[annotations]]
path = "src/assets/**"
SPDX-FileCopyrightText = "2006 The Inconsolata Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# ---- 数据：本仓库自己的汇编 --------------------------------------------------------
# 曲名/角色名/碟名是事实；来源见 docs/data-provenance.md。**不复制 THBWiki 的任何正文**。
# S5 起分类/面次派生链（.ref/thbwiki、data/meta 参照表）已删除 ⇒ 全仓库不再有 copyleft 文件。
[[annotations]]
path = ["data/**"]
SPDX-FileCopyrightText = "2026 multimode_Liu"
SPDX-License-Identifier = "MIT"

# ---- 固化的第三方代码：marked（原样分发，不能按 MIT 再许可为本项目的作品）-----------
# `src/vendor/marked/` 下是上游 `marked` 18.1.0 的原样拷贝（只剥了一行 sourceMappingURL）。
# **版权归上游**，所以要显式声明 —— 否则上面 `**` 那条 MIT 兜底会把它错记成
# "2026 multimode_Liu"，那是**署名错误**（把别人的代码说成自己写的），比漏声明更糟。
# 溯源 / 升级步骤 / 为什么固化：`src/vendor/marked/PROVENANCE.md`；决策：D189。
[[annotations]]
path = "src/vendor/marked/**"
SPDX-FileCopyrightText = "2018-2026 MarkedJS, 2011-2018 Christopher Jeffrey"
SPDX-License-Identifier = "MIT"

# ---- 授权凭据：截图里有他人（上游作者）的文字，不能按 MIT 再许可 --------------------
# 这是"留档"性质的证据文件，不是本项目的作品，所以用一个自定义的 LicenseRef 标明，
# 而不是让上面 `**` 的 MIT 兜底把它吃掉。说明见 LICENSES/LicenseRef-Permission-Evidence.txt。
[[annotations]]
path = "docs/permissions/**"
SPDX-FileCopyrightText = "2025 电球 魔爱天下第一，multimode_Liu"
SPDX-License-Identifier = "LicenseRef-Permission-Evidence"

# ---- 数据仓库落点：独立仓库，许可应在各自仓库里声明 --------------------------------
# 这里只是让 lint 有个交代（落点是 gitignored 的，lint 其实看不到）；真正的 LICENSE 要加到
# 那两个仓库里（见 THIRD-PARTY-NOTICES.md §5.3）。
[[annotations]]
path = ["data/otomads/**", "data/custom/**"]
SPDX-FileCopyrightText = "2026 multimode_Liu"
SPDX-License-Identifier = "MIT"

# ---- 第三方许可正文：`LICENSES/` 里的单份存放，由声明文件点名 ----------------------
# `LICENSES/{BSD-3-Clause,ISC,Apache-2.0}.txt` 是**随产物分发的第三方许可正文**（包不在仓库里，
# 没法逐文件标）。REUSE 只认"被某个文件的 SPDX 标识符引用"，而 `LICENSES/` 自己不算引用方
# （试过：给正文文件自身加注解仍报 Unused licenses）⇒ 在这里由它们所属的声明文件代言。
# `MIT` 要留着：这条比上面 `**` 更贴近，会把那条覆盖掉。
[[annotations]]
path = "THIRD-PARTY-NOTICES.md"
SPDX-FileCopyrightText = "2026 multimode_Liu"
SPDX-License-Identifier = "MIT AND BSD-3-Clause AND ISC AND Apache-2.0"
