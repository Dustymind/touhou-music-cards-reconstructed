# GitHub Pages 部署（纯静态，无后端）。
#
# 为什么能这么简单：
#   - `public/data/**`（13 个生成物，含三份镜像表与音MAD 数据集）**随仓库提交**，
#     所以 CI 不需要 Python / uv，也不需要初始化 `data/otomads` submodule；
#   - `vite.config.ts` 的 `base` 是 `./`，子目录项目页（`user.github.io/<repo>/`）不用改配置。
#
# 一次性设置：仓库 Settings → Pages → Build and deployment → Source 选 **GitHub Actions**。
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 让同一分支的旧部署先结束（官方推荐写法）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 版本按仓库本地开发环境对齐（Node 24 / pnpm 12）；没有 .nvmrc，所以写在这里
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/configure-pages@v6
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      # `pnpm build` = `tsc --noEmit && vite build`：类型检查也是这一关的一部分
      - name: 类型检查 + 构建
        run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
