# GitHub Pages 部署（纯静态，无后端）。
#
# ⚠️ **2026-09-25 起暂时停用**（D146）：应用现在由 **Vercel** 部署（`vercel.json`），而这个仓库的
#    GitHub Pages **从没启用过** —— 每次 push 都在 `actions/configure-pages` 那一步失败
#    （`Get Pages site failed`，本工作流 23 次运行全部失败/取消）。停用的是**触发器**，工作流本体
#    一个字没动，将来要用 Pages 时：
#
#      1. 恢复下面 `push:` 那两行；
#      2. 仓库 Settings → Pages → Build and deployment → Source 选 **GitHub Actions**。
#
# 为什么能这么简单：
#   - `public/data/**`（13 个生成物，含三份镜像表与音MAD 数据集）**随仓库提交**，
#     所以 CI 不需要 Python / uv，也不需要初始化 `data/otomads` submodule；
#   - `vite.config.ts` 的 `base` 是 `./`，子目录项目页（`user.github.io/<repo>/`）不用改配置。
name: deploy-pages

on:
  # push:
  #   branches: [main]
  workflow_dispatch:      # 暂时只留手动触发（见上面的说明）

permissions:
  contents: read
  pages: write
  id-token: write

# 让同一分支的旧部署先结束（官方推荐写法）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 版本按仓库本地开发环境对齐（Node 24 / pnpm 12）；没有 .nvmrc，所以写在这里
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/configure-pages@v6
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      # `pnpm build` = `tsc --noEmit && vite build`：类型检查也是这一关的一部分
      - name: 类型检查 + 构建
        run: pnpm build
      # 音MAD 素材**不在这里拉**（用户裁定：静态音MAD 源手动部署，见 D138）：
      # 音频不进仓库，归档由 `pnpm media:pack` 产出、发布成 Release 资产，**由人**铺到静态站根目录。
      # 这条工作流保持原来的取舍：纯静态、不需要 Python、不需要 submodule。
      # （顺带记一笔：写下上面这段时本仓库还是**私有**的，Release 资产对匿名请求返回 404；
      #   2026-09-28 复核：**仓库已公开**，匿名 `curl` 现在能直接取资产，那条限制不再成立。）
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
