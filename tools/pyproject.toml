[project]
name = "tmc-tools"
version = "0.1.0"
description = "东方歌牌重构版：数据迁移 / 校验 / 生成 / 分类工具（抓取与本地源助手在数据仓库 tools/，D130）"
readme = "README.md"
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tmc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
