# 音乐源注册表（一个模式一份；前端读取，改这里就能加/改音源，不需要改代码）。
# kind: remote = 远程镜像；local = 本机助手（可被「本地曲库地址」/`?localmusic=` 覆盖）；
#       custom = **使用者自己的源**（模式 3「自定义」，地址由他在设置页里填）
# order: 默认 fallback 顺序（用户在设置页可调）；enabled: 默认开关状态
#
# 模式 3「自定义」只有这一个源，而且 **table_url 就是空串**：
#   * 空串在这个 kind 下是**合法**的（守卫见 `tmc.build.source_table_url_problem`）——
#     "还没填"是这个模式的正常状态：自带数据集恒为空（0 角色 0 专辑），界面提示"必须填写自定义源链接"；
#   * 地址由使用者在设置页填（默认空、**重置 = 清空**）、或由 `?customsource=` 覆盖；
#     联机时主机也可以把它下发给客户端（只在本会话生效，不写回存档）。
#   非空时仍按 D131 那套判：相对路径或 http(s) 绝对 URL，**禁**根绝对路径（子目录部署下必 404）。
#
# 为什么注册表里还要留这一条而不是"运行时凭空造一个源"：源注册表是**前端读的那份真源**
# （`public/data/custom/sources.json`），留一条空的等于"这个模式有一个可填的源"，
# 界面、存档的键、联机配置下发的 sourceId 都有据可依。

[[source]]
id = "custom"
label_en = "Custom source"
label_zh = "自定义源"
table_url = ""     # 空 = 还没填；使用者在设置页里填，或由 `?customsource=` / 主机下发提供
kind = "custom"
order = 1          # 本模式只有它一个源
enabled = true     # 必须默认开：自定义模式除了它没有别的来源
proxyable = false
description_en = "Your own card list: one card name, one card face and one track per card, served from a manifest you host yourself."
description_zh = "你自己的卡表：一张卡 = 一个卡名 + 一张卡面 + 一首曲目，由你自己托管的清单提供。"
