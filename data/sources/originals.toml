# 音乐源注册表（一个模式一份；前端读取，改这里就能加/改音源，不需要改代码）。
# kind: remote = 远程镜像；local = 本机助手（tools/src/tmc/local_source.py）
# order: 默认 fallback 顺序（用户在设置页可调）；enabled: 默认开关状态
# proxyable: 预留 —— 出现混合内容/跨域时可由助手代理
# table_url 用**相对路径**（不带前导 `/`）= 相对**数据集目录**，同源取表（单端口部署下即同源）。
#   ✗ 不要写成 `/data/sources/x.json`：那是**域名根**绝对路径，站点一旦部署在子目录
#     （GitHub Pages 项目页 `user.github.io/<repo>/`、任意子路径反代）就会打到根上 → 404 →
#     该模式所有曲目解析不出地址（界面报"所有已启用的音源都取不到"）。守卫：`tmc.validate` +
#     `tools/tests/test_build.py`（D131）。
#
# 为什么按模式拆（契约 docs/sources-separation-v1.md）：远程镜像里只有**原曲**曲目，本地助手只服务**音MAD**，
# 拆开之后音MAD 模式不会再下载那三份用不上的镜像表（约 334 KB），也不再需要"切模式时偷偷把本地源打开"。
#
# 原曲：三个远程镜像（**不含**本地源 —— 本地曲库只服务音MAD）。

[[source]]
id = "netease163"
label_en = "Netease 163"
label_zh = "网易云音乐"
table_url = "data/sources/netease163.json"
kind = "remote"
order = 1
enabled = true           # 默认开；URL 已统一升为 https://music.163.com/…（302 落点 CDN 亦支持 https）
proxyable = true
description_en = "Music from NetEase Cloud Music (163.com). Some tracks may be region-locked outside China; URLs are https with an http CDN redirect that browsers upgrade automatically."
description_zh = "网易云音乐。境外部分曲目可能不可用；外链已统一为 https，302 落点的 CDN 支持 https，浏览器会自动升级。"

