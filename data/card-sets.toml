# 卡面图集注册表。素材**不随仓库分发**（版权与体积），运行时按 origins 顺序远程加载；
# 用户若把图集放进仓库根 cards-otomads/（结构与本地助手同），local_prefix 会优先生效。
#
# r2 参数（?r2=1）等价于"把 origins 的第一项提到最前"（上游的语义）。
